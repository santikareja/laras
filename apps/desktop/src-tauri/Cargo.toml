[package]
name = "laras"
version = "0.1.0"
description = "Laras"
edition = "2024"
rust-version = "1.90"

[lib]
name = "laras_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
